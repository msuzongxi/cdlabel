services:
  postgres:
    image: postgres:17
    container_name: cgdi-postgres
    environment:
      POSTGRES_DB: cgdi
      POSTGRES_USER: cgdi
      POSTGRES_PASSWORD: cgdi
    ports:
      - "5432:5432"
    volumes:
      - cgdi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgdi -d cgdi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cgdi_pgdata:
