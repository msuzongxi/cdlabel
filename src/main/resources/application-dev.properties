cgdi.bootstrap.enabled=true
cgdi.bootstrap.admin-password=${CGDI_ADMIN_PASSWORD:abitsTemp12345!}
cgdi.bootstrap.labeler1-password=${CGDI_LABELER1_PASSWORD:ybwls}
cgdi.bootstrap.labeler2-password=${CGDI_LABELER2_PASSWORD:ysglp}
cgdi.bootstrap.labeler3-password=${CGDI_LABELER3_PASSWORD:stcsa}
cgdi.bootstrap.supervisor-password=${CGDI_SUPERVISOR_PASSWORD:sfamp}

# DEVELOPMENT RESET (OPT-IN)
# Safe default: normal application restarts PRESERVE PostgreSQL study data.
# Set CGDI_RESET_ON_STARTUP=true only when you deliberately want a completely
# clean development database on the next start. After that start, remove the
# environment variable or set it back to false.
cgdi.dev.reset-on-startup=${CGDI_RESET_ON_STARTUP:false}

# Long-term human-labeling data root. It contains calibration, blind-pilot,
# and formal-validation subfolders and is scanned recursively.
cgdi.filing-import.folder=${CGDI_FILING_FOLDER:./sample-data/human-labeling}
cgdi.filing-import.recursive=${CGDI_FILING_IMPORT_RECURSIVE:true}
