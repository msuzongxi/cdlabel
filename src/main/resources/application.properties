spring.application.name=cgdi-labeler
spring.profiles.default=dev

spring.datasource.url=${CGDI_DB_URL:jdbc:postgresql://localhost:5432/cgdi}
spring.datasource.username=${CGDI_DB_USER:cgdi}
spring.datasource.password=${CGDI_DB_PASSWORD:cgdi}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

# Folder importer. Point this at a folder containing one or more CSV / CSV.GZ files.
# Required columns: filename, company, fiscal_year, paragraph_id, text
# Optional columns: master_cik, section_hint, heading_context, word_count, table_like_flag
cgdi.filing-import.enabled=${CGDI_FILING_IMPORT_ENABLED:true}
cgdi.filing-import.folder=${CGDI_FILING_FOLDER:}
cgdi.filing-import.recursive=${CGDI_FILING_IMPORT_RECURSIVE:false}

server.port=${PORT:8080}
